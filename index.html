<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Archive</h1>
            <p class="subtitle">A place for things</p>
        </header>

        <main>
            <section class="input-section">
                <h2>Add</h2>

                <div class="input-group">
                    <label for="text-input">Text</label>
                    <textarea id="text-input" rows="3" placeholder="Write something..."></textarea>
                    <button onclick="addText()" class="btn">Add</button>
                </div>

                <div class="input-group">
                    <label for="photo-input">Image</label>
                    <input type="text" id="photo-input" placeholder="URL or upload">
                    <div class="button-row">
                        <button onclick="addPhoto()" class="btn">Add URL</button>
                        <input type="file" id="photo-file" accept="image/*" style="display: none;">
                        <button onclick="document.getElementById('photo-file').click()" class="btn">Upload</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="audio-input">Audio</label>
                    <input type="text" id="audio-input" placeholder="URL or upload">
                    <div class="button-row">
                        <button onclick="addAudio()" class="btn">Add URL</button>
                        <input type="file" id="audio-file" accept="audio/*" style="display: none;">
                        <button onclick="document.getElementById('audio-file').click()" class="btn">Upload</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="video-input">Video</label>
                    <input type="text" id="video-input" placeholder="URL or upload">
                    <div class="button-row">
                        <button onclick="addVideo()" class="btn">Add URL</button>
                        <input type="file" id="video-file" accept="video/*" style="display: none;">
                        <button onclick="document.getElementById('video-file').click()" class="btn">Upload</button>
                    </div>
                </div>

                <button onclick="clearAll()" class="btn btn-clear">Clear All</button>
            </section>

            <section class="display-section">
                <h2>Display</h2>
                <div id="content-container" class="content-container"></div>
            </section>
        </main>

        <footer>
            <p>Visitor <span id="visitor-count">0</span></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
