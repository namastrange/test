<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main>
            <section class="input-section">
                <div class="input-group">
                    <label for="text-input">text</label>
                    <textarea id="text-input" rows="2"></textarea>
                    <button onclick="addText()">add</button>
                </div>

                <div class="input-group">
                    <label for="photo-input">image</label>
                    <input type="text" id="photo-input">
                    <button onclick="addPhoto()">add url</button>
                    <input type="file" id="photo-file" accept="image/*" style="display: none;">
                    <button onclick="document.getElementById('photo-file').click()">upload</button>
                </div>

                <div class="input-group">
                    <label for="audio-input">audio</label>
                    <input type="text" id="audio-input">
                    <button onclick="addAudio()">add url</button>
                    <input type="file" id="audio-file" accept="audio/*" style="display: none;">
                    <button onclick="document.getElementById('audio-file').click()">upload</button>
                </div>

                <div class="input-group">
                    <label for="video-input">video</label>
                    <input type="text" id="video-input">
                    <button onclick="addVideo()">add url</button>
                    <input type="file" id="video-file" accept="video/*" style="display: none;">
                    <button onclick="document.getElementById('video-file').click()">upload</button>
                </div>

                <button onclick="clearAll()" class="clear-btn">clear</button>
            </section>

            <div id="content-container" class="content-container"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
